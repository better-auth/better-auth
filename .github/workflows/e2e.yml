name: E2E
on:
  push:
    branches: [ main, next ]
  merge_group:
  pull_request:

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM || github.repository_owner }}
  BETTER_AUTH_TELEMETRY_ENDPOINT: ${{ vars.BETTER_AUTH_TELEMETRY_ENDPOINT }}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests run only the E2E jobs whose Turbo tasks are affected by the change.
  # Merge queue runs always run every job. Push runs skip commits the merge queue already
  # tested and run every job for commits that bypassed it.
  changes:
    name: Select E2E jobs
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'better-auth/better-auth' || github.event_name != 'pull_request' && github.repository == 'better-auth/better-auth') && 'starsling-ubuntu-26.04' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # look up this commit's merge queue E2E run on push
    env:
      TURBO_TOKEN: ""
    outputs:
      smoke: ${{ steps.select.outputs.smoke }}
      integration: ${{ steps.select.outputs.integration }}
      adapters: ${{ steps.select.outputs.adapters }}
      allow-skips: ${{ steps.select.outputs.allow-skips }}
    steps:
      - name: Check for a successful merge queue run
        id: queue
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if verified=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/e2e.yml/runs?head_sha=$GITHUB_SHA&event=merge_group&status=success" --jq '.total_count') \
            && [[ "$verified" -gt 0 ]]; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.queue.outputs.verified != 'true'
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false

      - name: Check for documentation-only changes
        id: diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Keep the required gate reporting and skip dependency setup for documentation.
          if git diff --quiet --no-renames "$BASE_SHA"...HEAD -- . \
            ':(exclude)docs/**' ':(top,glob,exclude).changeset/*.md' ':(top,glob,exclude)*.md' \
            ':(glob,exclude)**/README.md' ':(glob,exclude)**/CHANGELOG.md'; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          elif [[ "$?" == 1 ]]; then
            echo "mode=affected" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not compare PR files; running every E2E job."
          fi

      - uses: better-auth/shared-workflows/.github/actions/setup-pnpm@3181777f24e51b1ac88fd7cfe6dfcebccd9212d1
        id: setup
        if: steps.diff.outputs.mode == 'affected'
        continue-on-error: true

      - name: Select affected E2E jobs
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MODE: ${{ steps.diff.outputs.mode }}
          QUEUE_VERIFIED: ${{ steps.queue.outputs.verified }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
        run: |
          tasks=null
          adapters='[]'
          if [[ "$MODE" == "skip" || "$QUEUE_VERIFIED" == "true" ]]; then
            tasks='[]'
          else
            adapters=$(jq -ces '
              map(select(.scripts["e2e:integration"] != null) |
                {packages: .name, compose_services: .e2eComposeServices})
              | select(length > 0 and all(.[];
                  (.packages | test("^@better-auth-test/[a-z0-9][a-z0-9-]*$")) and
                  (.compose_services | test("^([a-z0-9][a-z0-9_-]*( [a-z0-9][a-z0-9_-]*)*)?$"))))
            ' e2e/adapter/test/*/package.json)
            if [[ "$MODE" == "affected" ]]; then
              if [[ "$SETUP_OUTCOME" != "success" ]] \
                || ! affected=$(./node_modules/.bin/turbo query affected --tasks e2e:integration e2e:smoke --base "$BASE_SHA" --head HEAD) \
                || ! tasks=$(jq -ce 'select(.errors == null) | .data.affectedTasks.items | arrays | map(.fullName) | select(all(.[]; type == "string"))' <<< "$affected"); then
                echo "::warning::Could not compute affected E2E tasks; running every E2E job."
                tasks=null
              fi
            fi
          fi

          jq -nr --argjson tasks "$tasks" --argjson adapters "$adapters" '
            "smoke=\($tasks == null or any($tasks[]?; endswith("#e2e:smoke")))",
            "integration=\($tasks == null or ($tasks | index("@better-auth-test/integration#e2e:integration") != null))",
            "adapters=\($adapters | map(select((.packages + "#e2e:integration") as $task
              | $tasks == null or ($tasks | index($task) != null))) | @json)",
            "allow-skips=\($tasks != null)"
          ' >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke test (${{ matrix.node-version }})
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    timeout-minutes: 30
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'better-auth/better-auth' || github.event_name != 'pull_request' && github.repository == 'better-auth/better-auth') && 'starsling-ubuntu-26.04' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests use Node 24. Merge queue and push runs cover all supported CI versions.
        node-version: ${{ fromJSON(github.event_name == 'pull_request' && '["24.x"]' || '["22.x", "24.x", "26.x"]') }}
    permissions:
      contents: read
    env:
      COMPOSE_SERVICES: redis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Reset Docker Containers
        run: docker compose down --volumes --remove-orphans

      - name: Start Docker Containers
        id: docker
        run: |
          read -r -a compose_services <<< "$COMPOSE_SERVICES"
          docker compose up -d --wait --wait-timeout 60 "${compose_services[@]}"
        background: true

      - uses: better-auth/shared-workflows/.github/actions/setup-pnpm@93cb569f835297529614ed443414b4a372d2dd7b
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build
        run: pnpm build

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.6.4

      - name: Wait for Docker
        wait: docker

      - name: Smoke
        timeout-minutes: 10
        run: pnpm e2e:smoke

      - name: Docker Compose Diagnostics
        if: failure() && hashFiles('docker-compose.yml') != ''
        run: |
          read -r -a compose_services <<< "$COMPOSE_SERVICES"
          docker compose ps --all || true
          docker compose logs --no-color "${compose_services[@]}" || true

      - name: Stop Docker Containers
        if: always() && hashFiles('docker-compose.yml') != ''
        run: docker compose down --volumes --remove-orphans
  integration:
    name: Integration test
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    timeout-minutes: 60
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'better-auth/better-auth' || github.event_name != 'pull_request' && github.repository == 'better-auth/better-auth') && 'starsling-ubuntu-26.04' || 'ubuntu-24.04' }}
    permissions:
      contents: read
    env:
      COMPOSE_SERVICES: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Reset Docker Containers
        run: docker compose down --volumes --remove-orphans

      - name: Start Docker Containers
        id: docker
        run: |
          read -r -a compose_services <<< "$COMPOSE_SERVICES"
          docker compose up -d --wait --wait-timeout 60 "${compose_services[@]}"
        background: true

      - uses: better-auth/shared-workflows/.github/actions/setup-pnpm@93cb569f835297529614ed443414b4a372d2dd7b

      - name: Install Next.js demo
        run: pnpm --dir demo/nextjs install --frozen-lockfile

      - name: Install Playwright Browsers
        uses: ./.github/actions/setup-playwright

      - name: Wait for Docker
        wait: docker

      - name: Integration
        run: pnpm e2e:integration --filter=./e2e/integration

      - name: Build Next.js demo
        working-directory: demo/nextjs
        env:
          BETTER_AUTH_SECRET: better-auth-scim-demo-ci-secret-at-least-thirty-two-characters
          BETTER_AUTH_URL: http://127.0.0.1:3000
          DEMO_SQLITE_PATH: ${{ runner.temp }}/better-auth-scim-demo-build.sqlite
          SCIM_DEMO_ENABLED: "true"
          SCIM_DEMO_OIDC_CLIENT_SECRET: better-auth-scim-demo-ci-oidc-client-secret
          SCIM_DEMO_TOKEN: better-auth-scim-demo-ci-token
        run: pnpm build

      - name: Upload integration browser artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-playwright-artifacts
          path: |
            e2e/integration/playwright-report
            e2e/integration/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Docker Compose Diagnostics
        if: failure() && hashFiles('docker-compose.yml') != ''
        run: |
          read -r -a compose_services <<< "$COMPOSE_SERVICES"
          docker compose ps --all || true
          docker compose logs --no-color "${compose_services[@]}" || true

      - name: Stop Docker Containers
        if: always() && hashFiles('docker-compose.yml') != ''
        run: docker compose down --volumes --remove-orphans
  adapter-integration:
    name: ${{ matrix.packages }} Integration Test
    needs: changes
    if: needs.changes.outputs.adapters != '[]'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'better-auth/better-auth' || github.event_name != 'pull_request' && github.repository == 'better-auth/better-auth') && 'starsling-ubuntu-26.04' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.adapters) }}
    env:
      COMPOSE_SERVICES: ${{ matrix.compose_services }}
      FILTER: ${{ matrix.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Reset Docker Containers
        run: docker compose down --volumes --remove-orphans

      - name: Start Docker Containers
        id: docker
        if: matrix.compose_services != ''
        run: |
          read -r -a compose_services <<< "$COMPOSE_SERVICES"
          for startup_attempt in 1 2; do
            if docker compose up -d --wait --wait-timeout 60 "${compose_services[@]}"; then
              exit 0
            fi

            if [[ "$startup_attempt" -eq 2 ]]; then
              exit 1
            fi

            echo "Container startup failed; resetting and retrying once."
            docker compose ps --all || true
            docker compose logs --no-color "${compose_services[@]}" || true
            if ! docker compose down --volumes --remove-orphans; then
              echo "::warning::Container cleanup failed; retrying startup with remaining resources."
            fi
          done
        background: true

      - uses: better-auth/shared-workflows/.github/actions/setup-pnpm@93cb569f835297529614ed443414b4a372d2dd7b

      - name: Build Adapter Dependencies
        run: pnpm exec turbo run build --filter="$FILTER..."

      # wait cannot take if:, so wait-all covers cells with and without compose services.
      - name: Wait for Docker
        wait-all:

      - name: Adapter Integration
        run: pnpm e2e:integration --filter="$FILTER"

      - name: Docker Compose Diagnostics
        if: failure() && hashFiles('docker-compose.yml') != '' && matrix.compose_services != ''
        run: |
          read -r -a compose_services <<< "$COMPOSE_SERVICES"
          docker compose ps --all || true
          docker compose logs --no-color "${compose_services[@]}" || true

          # Capture container exit and OOM state without masking the test failure.
          # cspell:ignore pids Pids
          for compose_service in "${compose_services[@]}"; do
            container_id="$(docker compose ps --all --quiet "$compose_service")"
            if [[ -n "$container_id" ]]; then
              docker inspect --format 'name={{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}}' "$container_id" || true
              docker inspect --format 'name={{.Name}} pids_limit={{.HostConfig.PidsLimit}} memory_limit={{.HostConfig.Memory}} memory_swap={{.HostConfig.MemorySwap}}' "$container_id" || true
              image_id="$(docker inspect --format '{{.Image}}' "$container_id" || true)"
              if [[ -n "$image_id" ]]; then
                docker image inspect --format 'image_id={{.Id}} repo_digests={{json .RepoDigests}}' "$image_id" || true
              fi
            fi
          done

      - name: Stop Docker Containers
        if: always() && hashFiles('docker-compose.yml') != ''
        run: docker compose down --volumes --remove-orphans

  e2e:
    runs-on: ubuntu-latest
    needs: [changes, smoke, integration, adapter-integration]
    if: always()
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          # Skips are allowed only when the changes job chose them; every other run must run all jobs.
          allowed-skips: ${{ needs.changes.outputs.allow-skips == 'true' && 'smoke, integration, adapter-integration' || '' }}
          jobs: ${{ toJSON(needs) }}
