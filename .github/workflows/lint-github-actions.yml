name: Lint GitHub Actions

on:
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
      - next
      - "release/**"
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    uses: better-auth/shared-workflows/.github/workflows/lint-github-actions.yml@93cb569f835297529614ed443414b4a372d2dd7b
