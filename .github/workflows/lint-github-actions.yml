name: Lint GitHub Actions

on:
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
      - next
      - "release/**"
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    uses: better-auth/shared-workflows/.github/workflows/lint-github-actions.yml@3181777f24e51b1ac88fd7cfe6dfcebccd9212d1
