name: Release

on:
  push:
    branches:
      - v1.6.x
  workflow_dispatch:

permissions: {}

jobs:
  release:
    permissions:
      contents: read
      id-token: write
    uses: better-auth/better-auth/.github/workflows/release.yml@0e02187ab45a903c66986fc5e28cddd37185147b
    with:
      use_shared_tooling: true
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
